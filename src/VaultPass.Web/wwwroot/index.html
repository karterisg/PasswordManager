<body>

    <script src="js/vault-crypto.js"></script>
    <script>
        function downloadFile(filename, content) {
            const a = document.createElement('a');
            a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(content);
            a.download = filename;
            a.click();
        }
    </script>

</body>
