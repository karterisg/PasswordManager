<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 340px; min-height: 400px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f7; color: #1d1d1f; font-size: 14px; }

    .header { background: #0066cc; color: #fff; padding: 14px 16px; display: flex; align-items: center; gap: 10px; }
    .header .logo { font-size: 20px; }
    .header h1 { font-size: 16px; font-weight: 600; }
    .header .signout { margin-left: auto; background: none; border: 1px solid rgba(255,255,255,.5); color: #fff; border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 12px; }

    .view { padding: 16px; }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; font-weight: 500; margin-bottom: 4px; color: #6e6e73; }
    .form-group input { width: 100%; padding: 8px 10px; border: 1px solid #e2e2e7; border-radius: 8px; font-size: 14px; background: #fff; outline: none; }
    .form-group input:focus { border-color: #0066cc; }

    .btn { width: 100%; padding: 10px; background: #0066cc; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; }
    .btn:hover { background: #0055aa; }
    .btn-sm { width: auto; padding: 5px 12px; font-size: 12px; }

    .error { background: #fff0f0; border: 1px solid #ffb3b3; color: #cc0000; border-radius: 8px; padding: 8px 10px; margin-bottom: 12px; font-size: 13px; }

    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .section-header h2 { font-size: 15px; font-weight: 600; }

    .vault-list { display: flex; flex-direction: column; gap: 8px; max-height: 280px; overflow-y: auto; }
    .vault-item { background: #fff; border: 1px solid #e2e2e7; border-radius: 10px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; }
    .vault-item-icon { font-size: 20px; flex-shrink: 0; }
    .vault-item-info { flex: 1; min-width: 0; }
    .vault-item-name { font-weight: 500; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .vault-item-url { font-size: 11px; color: #6e6e73; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .vault-item-fill { background: none; border: 1px solid #0066cc; color: #0066cc; border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; white-space: nowrap; }
    .vault-item-fill:hover { background: #0066cc; color: #fff; }

    .empty { text-align: center; padding: 32px 0; color: #6e6e73; }
    .empty .icon { font-size: 32px; margin-bottom: 8px; }

    #view-login, #view-vault { display: none; }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">🔐</span>
    <h1>VaultPass</h1>
    <button class="signout" id="btn-signout" style="display:none">Sign out</button>
  </div>

  <!-- LOGIN -->
  <div class="view" id="view-login">
    <div class="form-group" style="margin-top:8px">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com" />
    </div>
    <div class="form-group">
      <label>Master Password</label>
      <input type="password" id="password" placeholder="••••••••" />
    </div>
    <div id="login-error" class="error" style="display:none"></div>
    <button class="btn" id="btn-login">Sign In</button>
  </div>

  <!-- VAULT -->
  <div class="view" id="view-vault">
    <div class="section-header">
      <h2>My Vault</h2>
    </div>
    <div class="vault-list" id="vault-list"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
